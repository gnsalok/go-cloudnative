{{- $fullName := include "go-sample-app.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-frontend
  labels:
    {{- include "go-sample-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  ports:
  - name: http
    port: {{ .Values.frontend.servicePort }}
    targetPort: http
    protocol: TCP
  selector:
    {{- include "go-sample-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-backend
  labels:
    {{- include "go-sample-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  ports:
  - name: http
    port: {{ .Values.backend.servicePort }}
    targetPort: http
    protocol: TCP
  selector:
    {{- include "go-sample-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
